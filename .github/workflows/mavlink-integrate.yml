name: Integrate canonical MAVLink schema

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/mavlink-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out mavlink branch
        uses: actions/checkout@v4
        with:
          ref: mavlink
          fetch-depth: 0
          submodules: false

      - name: Set up Python and Poetry
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
          poetry install

      - name: Pin canonical MAVLink protobuf schema
        shell: bash
        run: |
          git config -f .gitmodules submodule.protobufs.url https://github.com/xznhj8129/meshtastic-protobufs.git
          git submodule sync -- protobufs
          git submodule update --init protobufs
          git -C protobufs remote set-url origin https://github.com/xznhj8129/meshtastic-protobufs.git
          git -C protobufs fetch origin 026b3121dc5ac7bfd236360a3aac6278065d7c47
          git -C protobufs checkout --detach 026b3121dc5ac7bfd236360a3aac6278065d7c47

      - name: Install pinned protobuf compiler and regenerate Python bindings
        shell: bash
        run: |
          curl -fsSL https://jpa.kapsi.fi/nanopb/download/nanopb-0.4.8-linux-x86.tar.gz -o /tmp/nanopb.tar.gz
          tar -xzf /tmp/nanopb.tar.gz
          ./bin/regen-protobufs.sh

      - name: Add MAVLink schema regression test
        shell: bash
        run: |
          cat > meshtastic/tests/test_mavlink_protobuf.py <<'PY'
          import pytest

          from meshtastic.protobuf import module_config_pb2

          pytestmark = pytest.mark.unit


          def test_mavlink_serial_mode_and_peer_round_trip():
              descriptor = module_config_pb2.ModuleConfig.SerialConfig.DESCRIPTOR
              serial_mode = descriptor.enum_types_by_name["Serial_Mode"]
              assert serial_mode.values_by_name["MAVLINK"].number == 11

              peer_field = descriptor.fields_by_name["peer_node"]
              assert peer_field.number == 9

              original = module_config_pb2.ModuleConfig.SerialConfig(
                  mode=serial_mode.values_by_name["MAVLINK"].number,
                  peer_node=0x12345678,
              )
              decoded = module_config_pb2.ModuleConfig.SerialConfig()
              decoded.ParseFromString(original.SerializeToString())

              assert decoded.mode == 11
              assert decoded.peer_node == 0x12345678
          PY

      - name: Run MAVLink protobuf regression test
        shell: bash
        run: poetry run pytest meshtastic/tests/test_mavlink_protobuf.py -q

      - name: Commit integrated Python change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/mavlink-integrate.yml
          git add .gitmodules protobufs meshtastic/protobuf meshtastic/tests/test_mavlink_protobuf.py
          git commit -m "Integrate canonical MAVLink configuration"
          git push origin HEAD:mavlink
